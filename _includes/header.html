<header class="site-header">
  <div class="shell header-inner">
    <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home"><span aria-hidden="true">QH</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span class="sr-only">Toggle navigation</span><span></span><span></span>
    </button>
    <nav class="site-nav" id="site-navigation" aria-label="Main navigation">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
