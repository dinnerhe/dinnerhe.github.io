---
layout: default
---
<article class="shell page-wrap article-wrap">
  <header class="article-header">
    <a class="eyebrow back-link" href="{{ '/notes/' | relative_url }}">← All notes</a>
    <h1>{{ page.title }}</h1>
    <p class="article-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.reading_time %}<span>{{ page.reading_time }} min read</span>{% endif %}</p>
  </header>
  <div class="prose">{{ content }}</div>
</article>
